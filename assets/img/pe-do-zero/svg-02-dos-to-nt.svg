<svg xmlns="http://www.w3.org/2000/svg" width="520" height="308" viewBox="0 0 520 308" font-family="monospace" font-size="13">
  <rect width="520" height="308" fill="#1a1a2e"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f4a261"/>
    </marker>
  </defs>

  <!-- DOS Header -->
  <rect x="20" y="14" width="480" height="106" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="38" y="38" fill="#e94560" font-size="14" font-weight="bold">IMAGE_DOS_HEADER</text>

  <rect x="38" y="48" width="444" height="26" rx="3" fill="#0f3460"/>
  <text x="52" y="66" fill="#a8dadc">e_magic</text>
  <text x="168" y="66" fill="#e9c46a">0x5A4D  "MZ"</text>

  <rect x="38" y="80" width="444" height="26" rx="3" fill="#0f3460"/>
  <text x="52" y="98" fill="#a8dadc">e_lfanew</text>
  <text x="168" y="98" fill="#e9c46a">0x100</text>
  <text x="310" y="98" fill="#f4a261">aponta para NT Headers</text>

  <!-- Arrow -->
  <line x1="260" y1="120" x2="260" y2="152" stroke="#f4a261" stroke-width="2" marker-end="url(#arr)"/>
  <text x="272" y="141" fill="#f4a261" font-size="12">e_lfanew = 0x100</text>

  <!-- NT Headers -->
  <rect x="20" y="158" width="480" height="136" rx="6" fill="#16213e" stroke="#4cc9f0" stroke-width="2"/>
  <text x="38" y="182" fill="#4cc9f0" font-size="14" font-weight="bold">IMAGE_NT_HEADERS</text>

  <rect x="38" y="192" width="444" height="26" rx="3" fill="#0f3460"/>
  <text x="52" y="210" fill="#a8dadc">Signature</text>
  <text x="168" y="210" fill="#e9c46a">0x4550  "PE\0\0"</text>

  <rect x="38" y="226" width="210" height="28" rx="3" fill="#1a3a5c" stroke="#a8dadc" stroke-width="1"/>
  <text x="52" y="245" fill="#a8dadc">FileHeader</text>

  <rect x="258" y="226" width="224" height="28" rx="3" fill="#1a3a5c" stroke="#a8dadc" stroke-width="1"/>
  <text x="272" y="245" fill="#a8dadc">OptionalHeader</text>

  <text x="38" y="278" fill="#555" font-size="12">+ Section Headers logo em seguida</text>
</svg>

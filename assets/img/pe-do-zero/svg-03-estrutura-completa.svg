<svg xmlns="http://www.w3.org/2000/svg" width="580" height="514" viewBox="0 0 580 514" font-family="monospace" font-size="13">
  <rect width="580" height="514" fill="#1a1a2e"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f4a261"/>
    </marker>
  </defs>

  <!-- DOS Header -->
  <rect x="16" y="14" width="548" height="88" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="32" y="37" fill="#e94560" font-weight="bold">IMAGE_DOS_HEADER</text>
  <rect x="32" y="46" width="248" height="22" rx="3" fill="#0f3460"/>
  <text x="44" y="62" fill="#a8dadc">e_magic = 0x5A4D  "MZ"</text>
  <rect x="292" y="46" width="256" height="22" rx="3" fill="#0f3460"/>
  <text x="304" y="62" fill="#a8dadc">e_lfanew = 0x100</text>
  <rect x="32" y="74" width="512" height="22" rx="3" fill="#0a1628"/>
  <text x="44" y="90" fill="#555" font-size="12">e_lfanew aponta para o inicio dos NT Headers</text>

  <!-- Arrow DOS to NT -->
  <line x1="290" y1="102" x2="290" y2="122" stroke="#f4a261" stroke-width="2" marker-end="url(#arr)"/>

  <!-- NT Headers outer -->
  <rect x="16" y="128" width="548" height="256" rx="6" fill="#16213e" stroke="#4cc9f0" stroke-width="2"/>
  <text x="32" y="150" fill="#4cc9f0" font-weight="bold">IMAGE_NT_HEADERS</text>
  <rect x="32" y="158" width="512" height="22" rx="3" fill="#0f3460"/>
  <text x="44" y="174" fill="#a8dadc">Signature = 0x4550  "PE\0\0"</text>

  <!-- FileHeader inner -->
  <rect x="32" y="188" width="222" height="90" rx="4" fill="#0f3460" stroke="#a8dadc" stroke-width="1"/>
  <text x="44" y="206" fill="#a8dadc" font-weight="bold">FILE_HEADER</text>
  <text x="44" y="224" fill="#888">Machine = 0x8664 (x64)</text>
  <rect x="38" y="230" width="210" height="20" rx="2" fill="#1a3a5c"/>
  <text x="44" y="245" fill="#e9c46a">NumberOfSections = 7</text>
  <text x="44" y="266" fill="#888">Characteristics = 0x0022</text>

  <!-- OptionalHeader inner -->
  <rect x="266" y="188" width="282" height="188" rx="4" fill="#0f3460" stroke="#a8dadc" stroke-width="1"/>
  <text x="278" y="206" fill="#a8dadc" font-weight="bold">OPTIONAL_HEADER</text>
  <text x="278" y="224" fill="#888">ImageBase</text>
  <text x="278" y="242" fill="#888">AddressOfEntryPoint</text>

  <!-- DataDirectory sub-box -->
  <rect x="278" y="250" width="258" height="118" rx="3" fill="#1a3a5c" stroke="#f4a261" stroke-width="1"/>
  <text x="290" y="268" fill="#f4a261" font-weight="bold">DataDirectory[]</text>
  <text x="290" y="287" fill="#888">[0]  Export Table</text>
  <rect x="286" y="293" width="244" height="20" rx="2" fill="#0f3460"/>
  <text x="290" y="308" fill="#e9c46a">[1]  Import Table</text>
  <text x="290" y="327" fill="#888">[2]  Resource Table</text>
  <text x="290" y="345" fill="#888">[5]  BaseReloc ...</text>

  <!-- Arrow from Import Table entry to right edge label -->
  <line x1="524" y1="303" x2="548" y2="303" stroke="#e9c46a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Note inside NT box -->
  <text x="32" y="368" fill="#555" font-size="11">VirtualAddress + PointerToRawData das secoes fazem a conversao RVA para offset</text>

  <!-- Section Headers -->
  <rect x="16" y="398" width="548" height="100" rx="6" fill="#16213e" stroke="#7209b7" stroke-width="2"/>
  <text x="32" y="420" fill="#7209b7" font-weight="bold">SECTION HEADERS</text>

  <rect x="32"  y="428" width="114" height="28" rx="3" fill="#0f3460"/>
  <text x="44"  y="447" fill="#a8dadc">.text</text>

  <rect x="158" y="428" width="114" height="28" rx="3" fill="#0f3460"/>
  <text x="170" y="447" fill="#a8dadc">.rdata</text>

  <rect x="284" y="428" width="114" height="28" rx="3" fill="#0f3460"/>
  <text x="296" y="447" fill="#a8dadc">.data</text>

  <rect x="410" y="428" width="114" height="28" rx="3" fill="#0f3460"/>
  <text x="422" y="447" fill="#a8dadc">.rsrc ...</text>

  <text x="32" y="476" fill="#555" font-size="12">VirtualAddress / PointerToRawData / Characteristics (rwx)</text>
  <text x="32" y="493" fill="#555" font-size="12">usados para converter RVA em offset real no arquivo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="510" viewBox="0 0 560 510" font-family="monospace" font-size="13">
  <rect width="560" height="510" fill="#1a1a2e"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f4a261"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e9c46a"/>
    </marker>
  </defs>

  <!-- ── DOS Header ── -->
  <rect x="16" y="14" width="528" height="72" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="32" y="36" fill="#e94560" font-weight="bold">IMAGE_DOS_HEADER</text>
  <rect x="32" y="44" width="248" height="24" rx="3" fill="#0f3460"/>
  <text x="44" y="61" fill="#a8dadc">e_magic = 0x5A4D  "MZ"</text>
  <rect x="290" y="44" width="238" height="24" rx="3" fill="#0f3460"/>
  <text x="302" y="61" fill="#a8dadc">e_lfanew = 0x100</text>
  <text x="476" y="61" fill="#f4a261">──┐</text>

  <!-- arrow DOS → NT -->
  <line x1="504" y1="86" x2="504" y2="108" stroke="#f4a261" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── NT Headers outer ── -->
  <rect x="16" y="110" width="528" height="248" rx="6" fill="#16213e" stroke="#4cc9f0" stroke-width="2"/>
  <text x="32" y="132" fill="#4cc9f0" font-weight="bold">IMAGE_NT_HEADERS</text>
  <rect x="32" y="140" width="510" height="22" rx="3" fill="#0f3460"/>
  <text x="44" y="156" fill="#a8dadc">Signature = 0x4550  "PE\0\0"</text>

  <!-- FileHeader inner -->
  <rect x="32" y="168" width="230" height="80" rx="4" fill="#0f3460" stroke="#a8dadc" stroke-width="1"/>
  <text x="44" y="186" fill="#a8dadc" font-weight="bold">FILE_HEADER</text>
  <text x="44" y="204" fill="#888">Machine        0x8664 (x64)</text>
  <text x="44" y="220" fill="#e9c46a">NumberOfSections  7</text>
  <text x="44" y="236" fill="#888">Characteristics  0x0022</text>

  <!-- OptionalHeader inner -->
  <rect x="274" y="168" width="268" height="180" rx="4" fill="#0f3460" stroke="#a8dadc" stroke-width="1"/>
  <text x="286" y="186" fill="#a8dadc" font-weight="bold">OPTIONAL_HEADER</text>
  <text x="286" y="204" fill="#888">ImageBase</text>
  <text x="286" y="220" fill="#888">AddressOfEntryPoint</text>
  <text x="286" y="236" fill="#888">SizeOfImage</text>
  <!-- DataDirectory sub-box -->
  <rect x="286" y="242" width="244" height="96" rx="3" fill="#1a3a5c" stroke="#f4a261" stroke-width="1"/>
  <text x="298" y="260" fill="#f4a261" font-weight="bold">DataDirectory[]</text>
  <text x="298" y="278" fill="#888">[0]  Export Table</text>
  <text x="298" y="295" fill="#e9c46a">[1]  Import Table ──────►</text>
  <text x="298" y="312" fill="#888">[2]  Resource Table</text>
  <text x="298" y="328" fill="#888">...</text>

  <!-- Import Table label -->
  <text x="468" y="295" fill="#e9c46a">Import</text>
  <text x="468" y="310" fill="#e9c46a">Table</text>

  <!-- Section headers note inside NT box -->
  <text x="32" y="344" fill="#666" font-size="11">  ↑ VirtualAddress + PointerToRawData de cada Section Header fazem a conversão RVA → offset</text>

  <!-- ── Section Headers ── -->
  <rect x="16" y="370" width="528" height="124" rx="6" fill="#16213e" stroke="#7209b7" stroke-width="2"/>
  <text x="32" y="392" fill="#7209b7" font-weight="bold">SECTION HEADERS</text>

  <!-- section boxes row 1 -->
  <rect x="32"  y="400" width="110" height="32" rx="3" fill="#0f3460"/>
  <text x="44"  y="421" fill="#a8dadc">.text</text>

  <rect x="154" y="400" width="110" height="32" rx="3" fill="#0f3460"/>
  <text x="162" y="421" fill="#a8dadc">.rdata</text>

  <rect x="276" y="400" width="110" height="32" rx="3" fill="#0f3460"/>
  <text x="288" y="421" fill="#a8dadc">.data</text>

  <rect x="398" y="400" width="110" height="32" rx="3" fill="#0f3460"/>
  <text x="412" y="421" fill="#a8dadc">.rsrc ...</text>

  <text x="32" y="454" fill="#666" font-size="12">  VirtualAddress  PointerToRawData  SizeOfRawData  Characteristics (rwx)</text>
  <text x="32" y="472" fill="#666" font-size="12">  usados para converter RVA em offset real no arquivo em disco</text>
</svg>
